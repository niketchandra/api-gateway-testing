_format_version: "3.0"

services:
  - name: users-service
    url: http://api:8000
    routes:
      - name: users-route
        paths:
          - /users
        strip_path: false
        methods:
          - GET
          - POST
          - PUT
          - DELETE
    plugins:
      - name: rate-limiting
        config:
          minute: 4
          policy: local
  - name: auth-service
    url: http://api:8000
    routes:
      - name: auth-login-route
        paths:
          - /auth/login
        strip_path: false
        methods:
          - POST
      - name: auth-logout-route
        paths:
          - /auth/logout
        strip_path: false
        methods:
          - POST